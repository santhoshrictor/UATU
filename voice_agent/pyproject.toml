[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-starter-python"
version = "1.0.0"
description = "UATU Voice Core Assistant built with LiveKit Agents for Python"
requires-python = ">=3.10, <3.15"

dependencies = [
    "aiohttp>=3.14.3",
    "faster-whisper>=1.2.1",
    "google-genai>=2.31.0",
    "livekit-agents[google,images]>=1.8.2,<2",
    "livekit-plugins-openai>=1.8.8",
    "livekit-plugins-silero>=1.8.8",
    "opencv-python-headless>=4.10.0",
    "pillow>=10.0.0",
    "psutil>=6.0.0",
    "python-dotenv>=1.0.0",
    "pyttsx3>=2.90",
    "soundfile>=0.12.0",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
# yarl 1.24.1 was published with only a cp310 wheel and no sdist, so it can't
# install on Python 3.11+. Remove this once upstream uploads the remaining wheels.
constraint-dependencies = ["yarl<1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
